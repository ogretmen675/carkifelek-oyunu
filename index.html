 }
 }).catch(()=>{});
 }catch(e){} // Keep the game playable if audio is unavailable.
}

function reset(){stopWheelSound();epoch++;remaining=items.map((_,i)=>i);active=null;angle=0;busy=false;$('wheel').style.transition='none';$('wheel').style.transform='rotate(0deg)';$('picture').className='';$('picture').innerHTML='<span class="idle">✦</span>';$('heading').textContent='Çarkı çevir!';$('status').textContent='Görsel gelsin, kelimesini seç.';$('spin').disabled=false;document.querySelectorAll('.confetti').forEach(e=>e.remove());draw();options();update()}
function spin(){if(busy||active!==null||!remaining.length)return;playWheelSound();busy=true;$('spin').disabled=true;options();$('heading').textContent='Çark dönüyor…';$('status').textContent='Hangi görsel gelecek?';let index=Math.floor(Math.random()*remaining.length),n=remaining.length;let target=360-(index+.5)*360/n;angle+=1440+((target-angle%360+360)%360);$('wheel').style.transition='transform 2.6s cubic-bezier(.12,.65,.17,1)';$('wheel').style.transform=`rotate(${angle}deg)`;let token=epoch;setTimeout(()=>{if(token!==epoch)return;active=remaining[index];busy=false;$('picture').innerHTML=items[active].art;$('picture').classList.add('show');$('heading').textContent='Görselin kelimesi hangisi?';$('status').textContent='Doğru kelimeye dokun.';options()},2650)}
function choose(id,b){if(busy||active===null)return;if(id!==active){b.classList.add('wrong');$('status').textContent='Bir daha bakalım.';setTimeout(()=>b.classList.remove('wrong'),400);return}busy=true;b.classList.add('good');$('status').textContent='Harika!';document.querySelectorAll('.word').forEach(e=>e.disabled=true);let token=epoch;setTimeout(()=>{if(token!==epoch)return;$('picture').classList.add('disappear');b.classList.add('disappear')},250);setTimeout(()=>{if(token!==epoch)return;remaining=remaining.filter(x=>x!==active);active=null;busy=false;$('picture').className='';$('wheel').style.transition='none';angle=0;$('wheel').style.transform='rotate(0deg)';draw();options();update();if(remaining.length){$('picture').innerHTML='<span class="idle">✦</span>';$('heading').textContent='Sıradaki görsel!';$('status').textContent='Çarkı yeniden çevir.';$('spin').disabled=false;setTimeout(()=>{if(token===epoch)spin()},650)}else{finish()}},800)}
function finish(){$('picture').className='show';$('picture').innerHTML='<span class="idle">🏆</span>';$('heading').textContent='Hepsini buldun!';$('status').textContent='Aferin! Yeniden oynamak için ↻ Yeniden düğmesine dokun.';$('spin').disabled=true;for(let i=0;i<65;i++){let p=document.createElement('i');p.className='confetti';p.style.cssText=`left:${Math.random()*100}vw;background:${colors[i%colors.length]};animation-delay:${Math.random()}s;--drift:${Math.random()*240-120}px`;document.body.append(p);setTimeout(()=>p.remove(),4300)}}
$('spin').onclick=spin;$('reset').onclick=reset;reset();

document.getElementById('full').onclick=()=>{if(document.fullscreenElement){document.exitFullscreen?.()}else{document.documentElement.requestFullscreen?.().catch(()=>{})}};
</script></html>
